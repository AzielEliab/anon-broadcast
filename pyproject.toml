[project]
name = "anon-broadcast"
version = "0.0.0"
description = "Status command for this download. The communique renderer is not in this package yet."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Aziel Eliab" }]

[project.scripts]
anon-broadcast = "anon_broadcast.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
