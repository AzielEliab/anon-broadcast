name = "anon-broadcast-download-tracker"
main = "src/index.js"
compatibility_date = "2026-09-10"
workers_dev = true
account_id = "ac575a9b822bea2bed97d0ab73aed238"

# Isolated counter. On deploy, create KV namespace ANON_BROADCAST_DOWNLOADS
# and replace the id below. Do not reuse another product's KV id.
# This placeholder is not a live namespace. Do not deploy from CI.
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "REPLACE_WITH_ANON_BROADCAST_DOWNLOADS_KV_ID"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/download", "/download/*", "/stats", "/event", "/go", "/count", "/install.sh", "/cite.json", "/sitemap.xml", "/robots.txt", "/llms.txt", "/openapi.json"]

[observability]
enabled = true
head_sampling_rate = 1
